<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta
      name="description"
      content="DRAFT.X — 하이엔드 전략과 심미적 안목으로 브랜드의 본질적인 변화를 만듭니다."
    >
    <title>DRAFT.X — Digital Design Agency</title>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/main.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문 바로가기</a>

    <header class="outer-box outer-box--header">
      <div class="inner-box">
        <div class="part-box part-box--between site-header">
          <a class="site-header__brand" href="#home" aria-label="DRAFT.X 홈">DRAFT.X</a>

          <nav class="site-header__navigation" aria-label="주요 메뉴">
            <a href="#home" aria-current="page">HOME</a>
            <a href="#works">WORKS</a>
            <a href="#lab-x">LAB.X</a>
            <a href="#contact">CONTACT</a>
          </nav>

          <a class="site-header__award" href="#works">
            <span>2026 GDWEB DESIGN AWARDS WINNER PRIZE //</span>
            <span class="site-header__prize-mark" aria-hidden="true">
              <span>W</span>
              <span>WINNER<br>PRIZE</span>
            </span>
          </a>
        </div>
      </div>
    </header>

    <main id="main-content">
      <section class="outer-box outer-box--hero" id="home" aria-labelledby="hero-title">
        <div class="inner-box">
          <div class="part-box hero-stage">
            <div class="hero-placeholder hero-placeholder--one" aria-hidden="true"></div>
            <div class="hero-placeholder hero-placeholder--two" aria-hidden="true"></div>
            <div class="hero-placeholder hero-placeholder--three" aria-hidden="true"></div>
            <div class="hero-placeholder hero-placeholder--four" aria-hidden="true"></div>
            <div class="hero-placeholder hero-placeholder--five" aria-hidden="true"></div>
            <div class="hero-placeholder hero-placeholder--six" aria-hidden="true"></div>
            <div class="hero-placeholder hero-placeholder--seven" aria-hidden="true"></div>
            <div class="hero-placeholder hero-placeholder--eight" aria-hidden="true"></div>

            <p class="hero-wordmark" aria-hidden="true">DRAFT.X</p>

            <div class="hero-copy">
              <h1 class="hero-copy__title" id="hero-title">
                <span>10+ years of aesthetic mastery meets</span>
                <span>high-end strategy,</span>
                <span>delivering essential changes</span>
                <span>for your brand.</span>
              </h1>
              <p class="hero-copy__description">
                축적된 심미적 안목이 하이엔드 전략과 만나,<br>
                브랜드에 본질적인 변화를 선사합니다.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <aside class="floating-chat" aria-label="카카오톡 상담">
      <a
        class="floating-chat__link"
        href="https://pf.kakao.com/_ANXIX/chat"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="카카오톡으로 상담하기 (새 창)"
      >
        <span aria-hidden="true">TALK</span>
      </a>
    </aside>
  </body>
</html>
