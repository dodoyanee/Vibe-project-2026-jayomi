<header class="outer-box outer-box--header" data-js="site-header" data-header-state="visible">
  <div class="inner-box">
    <div class="part-box part-box--between site-header">
      <a class="site-header__brand" href="#" aria-label="DRAFT.X 홈" data-site-link="home">DRAFT.X</a>
      <nav class="site-header__navigation" aria-label="주요 메뉴">
        <a href="#" data-site-link="home" data-nav-key="home">HOME</a>
        <a href="#" data-site-link="works">WORKS</a>
        <a href="#" data-site-link="lab">LAB.X</a>
        <a href="#" data-site-link="contact">CONTACT</a>
        <a href="#" data-site-link="velo" data-nav-key="velo">VELO</a>
        <a href="#" data-site-link="notice" data-nav-key="notice">NOTICE</a>
      </nav>
      <div class="notice-auth site-header__account" data-js="auth-control" aria-label="회원 메뉴">
        <span class="notice-auth__greeting" data-js="auth-greeting" hidden></span>
        <a class="notice-auth__link" data-js="auth-login" href="#">로그인</a>
        <a class="notice-auth__link" data-js="auth-signup" href="#">회원가입</a>
        <button class="notice-auth__link notice-auth__logout" data-js="auth-logout" type="button" hidden>로그아웃</button>
        <span class="notice-auth__error" data-js="auth-error" role="status" aria-live="polite" hidden></span>
      </div>
      <button class="site-header__menu-toggle" type="button" aria-controls="mobile-menu" aria-expanded="false" data-js="menu-toggle">MENU</button>
    </div>
  </div>
  <nav class="menu-panel" id="mobile-menu" aria-label="메뉴" aria-hidden="true" inert data-js="menu-panel" data-menu-state="closed" data-lenis-prevent>
    <div class="menu-panel__links">
      <a class="menu-panel__link" href="#" data-site-link="home" data-nav-key="home" data-js="menu-link">HOME</a>
      <a class="menu-panel__link" href="#" data-site-link="works" data-js="menu-link">WORKS</a>
      <a class="menu-panel__link" href="#" data-site-link="lab" data-js="menu-link">LAB.X</a>
      <a class="menu-panel__link" href="#" data-site-link="contact" data-js="menu-link">CONTACT</a>
      <a class="menu-panel__link" href="#" data-site-link="velo" data-nav-key="velo" data-js="menu-link">VELO</a>
      <a class="menu-panel__link" href="#" data-site-link="notice" data-nav-key="notice" data-js="menu-link">NOTICE</a>
      <div class="notice-auth notice-auth--mobile" data-js="auth-control" aria-label="회원 메뉴">
        <span class="notice-auth__greeting" data-js="auth-greeting" hidden></span>
        <a class="notice-auth__link" data-js="auth-login" href="#">로그인</a>
        <a class="notice-auth__link" data-js="auth-signup" href="#">회원가입</a>
        <button class="notice-auth__link notice-auth__logout" data-js="auth-logout" type="button" hidden>로그아웃</button>
        <span class="notice-auth__error" data-js="auth-error" role="status" aria-live="polite" hidden></span>
      </div>
    </div>
  </nav>
</header>
