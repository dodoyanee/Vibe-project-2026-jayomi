<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="DRAFT.X 공지사항 로그인 및 회원가입">
    <title>로그인 · 회원가입 | NOTICE · DRAFT.X</title>
    <link rel="icon" type="image/png" href="../images/cat_favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anta&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/closing-sections.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <script type="module" src="../js/notice-auth.js"></script>
  </head>
  <body id="top">
    <a class="skip-link" href="#main-content">본문 바로가기</a>
    <header class="outer-box outer-box--header">
      <div class="inner-box">
        <div class="part-box part-box--between site-header">
          <a class="site-header__brand" href="../index.html" aria-label="DRAFT.X 홈">DRAFT.X</a>
          <nav class="site-header__navigation" aria-label="계정 메뉴">
            <a href="notice.html">NOTICE</a>
            <span data-js="auth-greeting" hidden></span>
          </nav>
          <span class="site-header__award" aria-hidden="true">ACCOUNT / NOTICE</span>
        </div>
      </div>
    </header>
    <main id="main-content" tabindex="-1">
      <section class="outer-box" aria-labelledby="notice-heading">
        <div class="inner-box">
          <h1 id="notice-heading">로그인</h1>
          <section aria-labelledby="login-heading">
            <h2 id="login-heading">로그인</h2>
            <form data-js="login-form" novalidate>
              <p><label for="login-email">이메일</label><br><input id="login-email" name="email" type="email" autocomplete="email" required maxlength="254"></p>
              <p><label for="login-password">비밀번호</label><br><input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="6"></p>
              <div data-js="auth-message" role="status" aria-live="polite" hidden></div>
              <button type="submit">로그인</button>
            </form>
          </section>
          <section aria-labelledby="register-heading">
            <h2 id="register-heading">회원가입</h2>
            <p>회원가입 정보는 이름, 아이디, 이메일, 비밀번호입니다.</p>
            <form data-js="register-form" novalidate>
              <p><label for="register-name">이름</label><br><input id="register-name" name="name" type="text" autocomplete="name" required maxlength="40"></p>
              <p><label for="register-username">아이디</label><br><input id="register-username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9._\-]+"></p>
              <p><small>영문, 숫자, 점, 밑줄, 하이픈으로 3~20자 입력해 주세요.</small></p>
              <p><label for="register-email">이메일</label><br><input id="register-email" name="email" type="email" autocomplete="email" required maxlength="254"></p>
              <p><label for="register-password">비밀번호</label><br><input id="register-password" name="password" type="password" autocomplete="new-password" required minlength="6"></p>
              <p><small>Firebase 기준 6자 이상 입력해 주세요.</small></p>
              <div data-js="auth-message" role="status" aria-live="polite" hidden></div>
              <button type="submit">회원가입</button>
            </form>
          </section>
          <p><a href="notice.html">공지사항으로 돌아가기</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
